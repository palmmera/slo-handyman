<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My bookings — SLO Handyman</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="/img/icon.png" />
  <link rel="apple-touch-icon" href="/img/icon.png" />
  <style>
    .booking { text-align:left; display:flex; gap:12px; align-items:center; }
    .booking .grow { flex:1; }
    .booking .svc { font-weight:800; }
    .booking .meta { color:var(--muted); font-size:.88rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/"><img class="brand-logo" src="/img/logo-transparent.png" alt="Handyman San Luis Obispo" /></a>
      <nav class="nav-links" id="authNav"></nav>
    </div>
  </header>

  <main class="container center-narrow">
    <div class="page-head"><a class="back" href="/">← Home</a></div>
    <h1 id="title" style="margin:.2em 0">My bookings</h1>
    <p style="color:var(--muted)" id="subtitle">All the jobs you've booked, in one place.</p>
    <div id="list"><div class="skeleton">Loading…</div></div>
  </main>

  <footer class="footer">
    <div class="container">
      <div>SLO Handyman — San Luis Obispo, CA · <a href="/terms.html">Terms &amp; Conditions</a> · <a href="/faq.html">FAQ</a> · <a href="/contact.html">Contact Us</a></div>
    </div>
  </footer>

  <script type="module">
    import { el, money, qs, starsHtml, avatarEl, getMe, renderAuthNav } from "/js/common.js";

    const list = document.getElementById("list");

    const STATUS = {
      paid: { label: "Awaiting handyman response", cls: "pending" },
      accepted: { label: "Accepted — in progress", cls: "paid" },
      declined: { label: "Declined — refunded", cls: "declined" },
      work_done: { label: "Work done — release payment", cls: "pending" },
      completed: { label: "Completed", cls: "completed" },
    };

    async function run() {
      const user = await getMe();
      if (!user) {
        location.href = `/login.html?next=${encodeURIComponent("/account.html")}`;
        return;
      }
      renderAuthNav();
      document.getElementById("subtitle").textContent =
        `Signed in as ${user.email || user.name}. Your posted offers and bookings are here.`;

      const [bookRes, postRes, placesRes] = await Promise.all([
        fetch("/api/my/bookings"),
        fetch("/api/my/posts"),
        fetch("/api/assist/places"),
      ]);
      const data = await bookRes.json();
      const posted = await postRes.json().catch(() => ({ posts: [] }));
      const places = await placesRes.json().catch(() => ({ towns: [], categories: [] }));
      list.innerHTML = "";

      const labels = {
        open: "Waiting for a handyman",
        claimed: "Taken — payment still held",
        cancelled: "Cancelled — refunded",
        expired: "Nobody took it — refunded",
      };
      const mine = posted.posts || [];
      if (mine.length) {
        list.append(el("h2", { style: "text-align:left;margin:0 0 10px" }, "Your job offers"));
        for (const p of mine) {
          const card = el("div", { class: "card", style: "margin-bottom:12px;text-align:left" });
          const msg = el("div");
          card.append(
            el("div", { style: "font-weight:800" }, `${p.category || "Job"} · ${p.town || ""}`),
            el("div", { class: "meta", style: "margin-top:4px" }, `${labels[p.status] || p.status} · ${money(p.amount)}`),
          );
          if (p.status === "open") {
            const description = el("textarea", { class: "input", rows: "4", style: "margin-top:10px" });
            description.value = p.description || "";
            const category = el("select", { class: "input", style: "margin-top:8px" });
            for (const c of places.categories || []) {
              const opt = el("option", { value: c }, c);
              if (c === p.category) opt.selected = true;
              category.append(opt);
            }
            const town = el("select", { class: "input", style: "margin-top:8px" });
            for (const t of places.towns || []) {
              const opt = el("option", { value: t }, t);
              if (t === p.town) opt.selected = true;
              town.append(opt);
            }
            const amount = el("input", { class: "input", type: "number", min: "1", step: "0.01", style: "margin-top:8px" });
            amount.value = Number(p.amount).toFixed(2);
            const save = el("button", { class: "btn", type: "button", style: "margin-top:10px" }, "Save changes");
            const cancel = el("button", { class: "btn secondary", type: "button", style: "margin-top:8px" }, "Cancel and refund");
            save.addEventListener("click", async () => {
              save.disabled = true;
              msg.innerHTML = "";
              try {
                const res = await fetch(`/api/posts/${encodeURIComponent(p.id)}`, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    description: description.value,
                    category: category.value,
                    place: town.value,
                    amount: amount.value,
                  }),
                });
                const out = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(out.error || "Couldn't save that offer.");
                msg.append(el("div", { class: "notice ok", style: "margin-top:10px" }, out.refunded
                  ? `Saved. ${money(out.refunded)} is being refunded.`
                  : "Saved. The homepage shows the updated offer."));
              } catch (err) {
                msg.append(el("div", { class: "notice error", style: "margin-top:10px" }, err.message));
              }
              save.disabled = false;
            });
            cancel.addEventListener("click", async () => {
              if (!confirm("Cancel this offer and refund the full amount still held?")) return;
              cancel.disabled = true;
              const res = await fetch(`/api/posts/${encodeURIComponent(p.id)}/cancel`, { method: "POST" });
              const out = await res.json().catch(() => ({}));
              if (!res.ok) {
                cancel.disabled = false;
                msg.innerHTML = "";
                msg.append(el("div", { class: "notice error", style: "margin-top:10px" }, out.error || "Couldn't cancel that offer."));
                return;
              }
              location.reload();
            });
            card.append(
              description,
              category,
              town,
              amount,
              el("p", { class: "hint", style: "margin:8px 0 0" }, "Lowering the amount refunds the difference. To offer more, cancel for a refund and post a new job. Cancel refunds whatever is still held."),
              save,
              cancel,
              msg,
            );
          } else {
            card.append(el("p", { style: "margin:8px 0 0;white-space:pre-wrap" }, p.description || ""));
            if (p.manageUrl) card.append(el("a", { class: "btn", href: p.manageUrl, style: "margin-top:10px" }, "View booking"));
          }
          list.append(card);
        }
      }

      if (!data.bookings || !data.bookings.length) {
        if (!mine.length) {
          list.append(el("div", { class: "empty" }, [
            el("p", {}, "You haven't booked any jobs yet."),
            el("a", { class: "btn", href: "/" }, "Find a handyman"),
          ]));
        }
        return;
      }

      for (const b of data.bookings) {
        const st = STATUS[b.status] || { label: b.status, cls: "paid" };
        const manageUrl = `/job.html?id=${b.id}&token=${b.token}`;
        list.append(el("a", { class: "card booking link", href: manageUrl, style: "margin-bottom:12px" }, [
          avatarEl({ name: b.handymanName, photoUrl: b.handymanPhoto }, "width:46px;height:46px;font-size:1rem"),
          el("div", { class: "grow" }, [
            el("div", { class: "svc" }, b.service || "Job"),
            el("div", { class: "meta" }, `${b.handymanName} · ${money(b.totalCharged)}${b.scheduledFor ? " · " + b.scheduledFor : ""}`),
            typeof b.rating === "number"
              ? el("div", { style: "margin-top:2px", html: starsHtml(b.rating) })
              : el("span", { class: `badge ${st.cls}`, style: "margin-top:4px;display:inline-block" }, st.label),
          ]),
          el("span", { style: "color:var(--muted)" }, "›"),
        ]));
      }
    }

    run().catch((e) => {
      list.innerHTML = "";
      list.append(el("div", { class: "notice error" }, "Couldn't load your bookings."));
      console.error(e);
    });
  </script>
  <script type="module" src="/js/talk.js"></script>
</body>
</html>
